<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e0c1c">
  <title>Tetris</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 30%, #2a2440 0%, #0e0c1c 70%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: #e8e8e8;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }
    #app {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      /* dvh excludes the mobile URL bar; vh is the fallback for older browsers.
         Order matters — the LAST supported declaration wins, so dvh comes last. */
      width: 100%; height: 100vh; height: 100dvh;
      gap: 10px; padding: 6px;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #challenge-banner {
      display: none;
      background: linear-gradient(90deg, rgba(155,89,182,0.25), rgba(74,214,255,0.25));
      border: 1px solid rgba(255,255,255,0.18);
      padding: 8px 14px; border-radius: 8px;
      font-size: 13px; letter-spacing: 0.3px;
      text-align: center; cursor: pointer;
      max-width: 92vmin;
    }
    #challenge-banner.visible { display: block; }
    #challenge-banner b { color: #ffd166; font-weight: 700; }

    #canvas-wrap {
      box-shadow: 0 12px 60px rgba(0, 0, 0, 0.65);
      border-radius: 10px; overflow: hidden; line-height: 0;
    }
    /* Canvas is 480×800 (3:5 portrait). Fit whichever axis is tighter. */
    canvas {
      display: block;
      width:  min(58vh, 95vw);
      height: min(96vh, 167vw);
      outline: none; background: #14101e;
      image-rendering: auto;     /* smooth scaling for glossy sprites */
      touch-action: none;
    }

    #lb-button {
      display: none;
      appearance: none;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.20);
      color: #fff;
      padding: 8px 18px;
      border-radius: 22px;
      font-size: 13px; font-weight: 600; letter-spacing: 0.4px;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    #lb-button.visible { display: inline-block; }
    #lb-button:active { background: rgba(255,255,255,0.20); transform: scale(0.97); }

    /* ----- Overlays (submit + leaderboard) ----- */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(8, 6, 18, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      /* Top-anchored so the mobile keyboard never hides the panel.
         Overlay itself scrolls if the panel gets taller than the viewport. */
      align-items: flex-start; justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 12px 24px;
      box-sizing: border-box;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .overlay.visible { display: flex; }
    .panel {
      background: linear-gradient(180deg, #1c1830 0%, #15121f 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 26px 22px;
      max-width: 440px; width: 100%;
      margin-top: 4vh;       /* float slightly from top on desktop; harmless on mobile */
      box-shadow: 0 20px 80px rgba(0,0,0,0.65);
    }
    @media (max-width: 600px) {
      .panel { margin-top: 0; padding: 22px 18px; border-radius: 16px; }
    }
    .panel h2 {
      margin: 0 0 6px; font-size: 13px; font-weight: 600;
      color: #888; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .panel .big-score {
      font-size: 52px; font-weight: 800;
      color: #ffd166; letter-spacing: -1px;
      margin: 4px 0 0;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .panel .meta { color: #888; font-size: 13px; margin: 6px 0 20px; }

    /* Form fields */
    .panel .field { margin-bottom: 18px; }
    .panel .field:last-of-type { margin-bottom: 0; }
    .panel label {
      display: block;
      font-size: 14px; font-weight: 600;
      color: #e8e8e8;
      letter-spacing: 0.2px;
      margin-bottom: 8px;
    }
    .panel .hint {
      display: block;
      font-size: 12px; color: #777;
      margin-top: 8px;
      line-height: 1.4;
    }
    /* Use a structural selector (.panel .field input) instead of input[type=...]
       because emcc's shell-file minifier strips type="text" — the default
       value — from the built HTML, leaving CSS attribute selectors like
       input[type="text"] unmatched on the name input. */
    .panel .field input {
      width: 100%; box-sizing: border-box;
      padding: 16px 18px;
      font-size: 19px;         /* keep ≥16px so iOS doesn't auto-zoom */
      min-height: 56px;        /* thumb-friendly tap target */
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      -webkit-appearance: none; appearance: none;
      /* html/body has user-select:none for the canvas; opt inputs back in
         so caret placement, double-tap-to-select, and the system text-edit
         menu (Copy/Paste/Select All) all work. */
      -webkit-user-select: text;
      user-select: text;
    }
    /* Match the name input (no type attr after minification = default "text")
       and the email input separately for per-field tracking. */
    .panel .field input:not([type="email"]) { letter-spacing: 2px; text-transform: uppercase; }
    .panel .field input[type="email"]       { letter-spacing: 0; }
    .panel .field input:focus {
      outline: none;
      border-color: rgba(74,214,255,0.85);
      box-shadow: 0 0 0 3px rgba(74,214,255,0.18);
      background: rgba(255,255,255,0.10);
    }
    .panel .field input::placeholder { color: #555; letter-spacing: 1px; }
    /* Defeat the browser's native autofill background + dark text.
       The 1000px inset box-shadow paints over the autofill fill color
       (no other way to override it), text-fill-color forces our white,
       and the 5000s transition delay defers the yellow-flash entirely. */
    .panel .field input:-webkit-autofill,
    .panel .field input:-webkit-autofill:hover,
    .panel .field input:-webkit-autofill:focus,
    .panel .field input:-webkit-autofill:active {
      -webkit-text-fill-color: #fff;
      -webkit-box-shadow: 0 0 0 1000px rgba(28, 24, 48, 1) inset;
      caret-color: #fff;
      transition: background-color 5000s ease-in-out 0s;
    }

    .panel .btn-row { display: flex; gap: 10px; margin-top: 24px; }
    .panel .btn {
      flex: 1; appearance: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: #e8e8e8;
      padding: 16px;
      border-radius: 12px;
      font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
      cursor: pointer; font-family: inherit;
      min-height: 56px;
      -webkit-tap-highlight-color: transparent;
    }
    .panel .btn.primary {
      background: linear-gradient(90deg, #4ad6ff, #c266ff);
      border-color: transparent; color: #000;
    }
    .panel .btn:active { transform: scale(0.97); }
    .panel .btn:disabled { opacity: 0.4; cursor: default; transform: none; }

    /* Leaderboard tabs + rows */
    .lb-tabs {
      display: flex; gap: 4px; margin: -6px 0 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .lb-tab {
      flex: 1; appearance: none; background: transparent; border: none;
      color: #888; padding: 9px 4px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
      cursor: pointer; border-bottom: 2px solid transparent;
      font-family: inherit;
    }
    .lb-tab.active { color: #fff; border-bottom-color: #4ad6ff; }
    .lb-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 1px; }
    .lb-row {
      display: grid; grid-template-columns: 30px 1fr auto;
      gap: 10px; padding: 8px 10px;
      align-items: baseline; border-radius: 6px; font-size: 14px;
    }
    .lb-row.you { background: rgba(74,214,255,0.12); }
    .lb-row .rank { color: #666; font-variant-numeric: tabular-nums; }
    .lb-row.top1 .rank { color: #ffd166; }
    .lb-row.top2 .rank { color: #c5d0d6; }
    .lb-row.top3 .rank { color: #cd7f32; }
    .lb-row .name { color: #e8e8e8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-row .score { color: #ffd166; font-weight: 600; font-variant-numeric: tabular-nums; }
    .lb-empty, .lb-loading { padding: 24px; text-align: center; color: #888; font-size: 13px; }

    #toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #1c1830;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 10px 18px;
      border-radius: 24px; font-size: 13px;
      transition: transform 0.3s ease, opacity 0.3s;
      opacity: 0; z-index: 200; pointer-events: none;
    }
    #toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }

    #status { font-size: 12px; color: #888; height: 14px; letter-spacing: 0.3px; }
    #loader { width: 220px; height: 3px; background: #2a2638; border-radius: 2px; overflow: hidden; }
    #loader > div {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #4ad6ff, #c266ff);
      transition: width 0.2s ease;
    }
    #footer { position: fixed; bottom: 10px; font-size: 11px; color: #555; }
    #footer a { color: #777; text-decoration: none; }
    @media (max-width: 768px) { #footer { display: none; } }
  </style>
</head>
<body>
  <div id="app">
    <div id="challenge-banner"></div>
    <div id="canvas-wrap">
      <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <button id="lb-button" aria-label="Open leaderboard">🏆  LEADERBOARD</button>
    <div id="status">Loading…</div>
    <div id="loader"><div></div></div>
  </div>
  <div id="footer">C++ · raylib · WebAssembly · <a href="https://github.com/bymrbanks/tetris">source</a></div>

  <!-- Submit-score overlay (shown on Playing → GameOver transition) -->
  <div id="submit-overlay" class="overlay" role="dialog" aria-label="Submit score">
    <div class="panel">
      <h2>Game Over</h2>
      <div class="big-score" id="submit-score">0</div>
      <div class="meta" id="submit-meta">—</div>
      <div class="field">
        <label for="submit-name">Your name</label>
        <!-- readonly at page load defeats Safari/Chrome autofill heuristics
             (which check readonly state once, on form discovery). Stripped
             in openSubmitOverlay() before focus. -->
        <input id="submit-name" type="text" maxlength="16"
               autocomplete="off" autocapitalize="characters"
               spellcheck="false" inputmode="text" enterkeyhint="next"
               placeholder="AAA" readonly>
      </div>
      <div class="field">
        <label for="submit-email">Email</label>
        <input id="submit-email" type="email" maxlength="254"
               autocomplete="off" autocapitalize="none"
               spellcheck="false" inputmode="email" enterkeyhint="send"
               placeholder="you@example.com" readonly>
        <span class="hint">Only needed if you want to win challenge prizes — no spam, promise.</span>
      </div>
      <div class="btn-row">
        <button class="btn" id="submit-skip">SKIP</button>
        <button class="btn primary" id="submit-go">SUBMIT</button>
      </div>
    </div>
  </div>

  <!-- Leaderboard overlay (reachable from menu, auto on submit) -->
  <div id="lb-overlay" class="overlay" role="dialog" aria-label="Leaderboard">
    <div class="panel">
      <h2>🏆 Leaderboard</h2>
      <div class="lb-tabs" id="lb-tabs">
        <button class="lb-tab active" data-period="all">All time</button>
        <button class="lb-tab" data-period="week">Week</button>
        <button class="lb-tab" data-period="month">Month</button>
        <button class="lb-tab" data-period="challenge" id="lb-tab-challenge" style="display:none">Challenge</button>
      </div>
      <div id="lb-body"><div class="lb-loading">Loading…</div></div>
      <div class="btn-row">
        <button class="btn" id="lb-close">CLOSE</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    'use strict';

    // ----- Keep keystrokes inside form inputs out of the WASM ------------
    // raylib's emscripten runtime attaches keydown/keyup listeners to the
    // document for gameplay key polling and calls preventDefault on many
    // keys (Backspace, Tab, Arrows, Space). Without intervention, typing in
    // the score-submit form would lose backspace, arrow keys, and spaces.
    // We install capture-phase listeners BEFORE the emscripten module loads
    // ({{{ SCRIPT }}} is at the bottom of this file) and stopImmediatePropagation
    // when the event target is a text input — so emscripten's listener never
    // sees the event but the browser's native text-edit behavior proceeds.
    (function() {
      const isTyping = (t) => t && (
        t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable
      );
      const shield = (e) => {
        if (isTyping(e.target)) {
          e.stopPropagation();
          e.stopImmediatePropagation();
        }
      };
      ['keydown', 'keyup', 'keypress'].forEach(evt => {
        window.addEventListener(evt, shield, true);     // capture phase, window
        document.addEventListener(evt, shield, true);   // capture phase, document
      });
    })();
    // ---------------------------------------------------------------------

    const TA = { LEFT: 0, RIGHT: 1, SOFT: 2, HARD: 3, ROTATE: 4, HOLD: 5, START: 6, PAUSE: 7 };
    const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3 };

    const statusEl = document.getElementById('status');
    const loaderBar = document.querySelector('#loader > div');
    const loaderEl = document.getElementById('loader');
    const canvas = document.getElementById('canvas');
    const banner = document.getElementById('challenge-banner');
    const lbBtn  = document.getElementById('lb-button');
    const submitOverlay = document.getElementById('submit-overlay');
    const lbOverlay     = document.getElementById('lb-overlay');
    const toastEl       = document.getElementById('toast');

    // ---------- localStorage helpers ----------
    function uuid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    }
    function getClientId() {
      let id = localStorage.getItem('clientId');
      if (!id) { id = uuid(); localStorage.setItem('clientId', id); }
      return id;
    }
    const getStoredName  = () => localStorage.getItem('playerName')  || '';
    const setStoredName  = n  => localStorage.setItem('playerName',  n);
    const getStoredEmail = () => localStorage.getItem('playerEmail') || '';
    const setStoredEmail = e  => localStorage.setItem('playerEmail', e);
    const getStoredHigh = () => parseInt(localStorage.getItem('highScore') || '0', 10);
    const setStoredHigh = v  => localStorage.setItem('highScore', String(v));

    // ---------- Module ----------
    let activeChallenge = null;
    let lastState = -1;

    var Module = {
      canvas,
      print:    t => console.log(t),
      printErr: t => console.error(t),
      setStatus(text) {
        if (!text) {
          statusEl.style.display = 'none';
          loaderEl.style.display = 'none';
          canvas.focus();
          return;
        }
        statusEl.textContent = text;
        const m = text.match(/([\d.]+)\/([\d.]+)/);
        if (m) loaderBar.style.width = (parseFloat(m[1]) / parseFloat(m[2]) * 100) + '%';
      },
      totalDependencies: 0,
      monitorRunDependencies(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
      },
      onRuntimeInitialized() {
        // Push localStorage high score into the game so the menu shows it.
        const hs = getStoredHigh();
        if (hs > 0 && Module._setHighScore) Module._setHighScore(hs);

        wireGestures();
        startStatePolling();
        fetchActiveChallenge();
      }
    };
    const safeCall = (fn, arg) => {
      const f = Module['_' + fn];
      if (typeof f === 'function') return f(arg);
    };
    const getGameState = () => Module._getGameState ? Module._getGameState() : -1;

    // ---------- Gestures ----------
    function wireGestures() {
      let startX = 0, startY = 0, startT = 0;
      let lastEmittedSteps = 0;
      let softActive = false;
      let pointerId = -1;
      let cellPx = 24;

      const computeCellPx = () => {
        // ~12 finger-cells across the canvas — a touch finer than the 10-cell board for forgiving aim.
        cellPx = Math.max(12, Math.round(canvas.clientWidth / 12));
      };
      computeCellPx();
      window.addEventListener('resize', computeCellPx);

      const endSoft = () => {
        if (softActive) { safeCall('touchUp', TA.SOFT); softActive = false; }
      };

      canvas.addEventListener('pointerdown', e => {
        e.preventDefault();
        if (pointerId !== -1) return; // ignore multi-touch
        pointerId = e.pointerId;
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        startX = e.clientX; startY = e.clientY;
        startT = performance.now();
        lastEmittedSteps = 0;
        softActive = false;
      });

      canvas.addEventListener('pointermove', e => {
        if (e.pointerId !== pointerId) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        // While the user is actively soft-dropping (finger committed downward),
        // ignore horizontal motion — otherwise diagonal flicks during a drop
        // produce unintended L/R moves. The lock releases when soft-drop ends
        // (finger moves back up, or pointerup).
        if (!softActive) {
          // Horizontal cell-step emission: each cellPx of cumulative travel = one move
          const steps = Math.trunc(dx / cellPx);
          const delta = steps - lastEmittedSteps;
          if (delta !== 0) {
            const action = delta > 0 ? TA.RIGHT : TA.LEFT;
            for (let i = 0; i < Math.abs(delta); i++) {
              safeCall('touchDown', action);
              safeCall('touchUp',   action);
            }
            lastEmittedSteps = steps;
          }
        }

        // Soft drop while finger drags downward (vertical-dominant)
        const verticalDominant = Math.abs(dy) > Math.abs(dx) * 1.5;
        if (dy > 24 && verticalDominant) {
          if (!softActive) {
            safeCall('touchDown', TA.SOFT);
            softActive = true;
            // Re-baseline horizontal so when soft ends we don't snap back to
            // a stale starting X (avoids a sudden multi-step move).
            startX = e.clientX;
            lastEmittedSteps = 0;
          }
        } else {
          endSoft();
        }
      });

      const onUp = e => {
        if (e.pointerId !== pointerId) return;
        pointerId = -1;
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        endSoft();

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const travel = Math.hypot(dx, dy);
        const elapsed = performance.now() - startT;
        const verticalDominant = Math.abs(dy) > Math.abs(dx) * 1.5;

        // Flick down fast → hard drop
        if (dy > 80 && elapsed < 220 && verticalDominant) {
          safeCall('touchDown', TA.HARD); safeCall('touchUp', TA.HARD);
          return;
        }
        // Swipe up → hold
        if (dy < -60 && verticalDominant) {
          safeCall('touchDown', TA.HOLD); safeCall('touchUp', TA.HOLD);
          return;
        }
        // Tap (no significant travel, quick)
        if (travel < 10 && elapsed < 250) {
          const action = (getGameState() === STATE.PLAYING) ? TA.ROTATE : TA.START;
          safeCall('touchDown', action); safeCall('touchUp', action);
        }
        // Otherwise: was a horizontal drag (already emitted as cell steps), no terminal action
      };
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);

      canvas.addEventListener('click', () => canvas.focus());
    }

    // ---------- State polling ----------
    function startStatePolling() {
      const tick = () => {
        const s = getGameState();
        if (s !== lastState) {
          onStateChange(lastState, s);
          lastState = s;
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
    function onStateChange(prev, curr) {
      lbBtn.classList.toggle('visible', curr === STATE.MENU);
      if (curr === STATE.GAMEOVER && prev === STATE.PLAYING) openSubmitOverlay();
    }

    // ---------- Submit overlay ----------
    function openSubmitOverlay() {
      const score = safeCall('getScore') || 0;
      const lines = safeCall('getLines') || 0;
      const level = safeCall('getLevel') || 1;
      const durMs = safeCall('getDurationMs') || 0;

      document.getElementById('submit-score').textContent = score.toLocaleString();
      const mins = Math.floor(durMs / 60000);
      const secs = Math.floor((durMs % 60000) / 1000);
      document.getElementById('submit-meta').textContent =
        'Lines ' + lines + '  ·  Level ' + level + '  ·  ' + mins + ':' + String(secs).padStart(2, '0');

      const nameInput  = document.getElementById('submit-name');
      const emailInput = document.getElementById('submit-email');
      // Strip readonly (set in HTML to defeat browser autofill) right before
      // we hand control to the user. By the time the browser would autofill,
      // the field is already considered "user-edited".
      nameInput.removeAttribute('readonly');
      emailInput.removeAttribute('readonly');
      nameInput.value  = getStoredName();
      emailInput.value = getStoredEmail();
      submitOverlay.classList.add('visible');
      setTimeout(() => nameInput.focus(), 50);

      if (score > getStoredHigh()) setStoredHigh(score);
    }
    function closeSubmitOverlay() { submitOverlay.classList.remove('visible'); }

    // Mobile UX: when an input gets focus, wait for the keyboard to start
    // animating then scroll the field into view inside the overlay so it
    // sits comfortably above the keyboard, not pinned to the top edge.
    function bindFieldFocus(id) {
      const el = document.getElementById(id);
      el.addEventListener('focus', () => {
        setTimeout(() => el.scrollIntoView({ block: 'center', behavior: 'smooth' }), 250);
      });
    }
    bindFieldFocus('submit-name');
    bindFieldFocus('submit-email');

    // Keyboard navigation: Enter on name → email, Enter on email → submit.
    document.getElementById('submit-name').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('submit-email').focus(); }
    });
    document.getElementById('submit-email').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('submit-go').click(); }
    });

    document.getElementById('submit-skip').addEventListener('click', closeSubmitOverlay);
    document.getElementById('submit-go').addEventListener('click', async () => {
      const nameInput  = document.getElementById('submit-name');
      const emailInput = document.getElementById('submit-email');
      let name = nameInput.value.trim();
      if (!name) name = 'AAA';
      if (name.length > 12) name = name.slice(0, 12);
      const email = emailInput.value.trim();
      setStoredName(name);
      setStoredEmail(email);

      const payload = {
        name,
        score: safeCall('getScore') || 0,
        lines: safeCall('getLines') || 0,
        level: safeCall('getLevel') || 1,
        durationMs: safeCall('getDurationMs') || 0,
        clientId: getClientId(),
        email: email || null
      };
      const btn = document.getElementById('submit-go');
      btn.disabled = true; btn.textContent = '…';
      try {
        const r = await fetch('/api/scores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
        const rank = data.rank && data.rank.allTime;
        showToast(rank ? ('Rank #' + rank + ' all-time') : 'Submitted!');
        closeSubmitOverlay();
        openLeaderboard('all');
      } catch (err) {
        showToast('Submit failed: ' + err.message);
      } finally {
        btn.disabled = false; btn.textContent = 'SUBMIT';
      }
    });

    // ---------- Leaderboard overlay ----------
    function openLeaderboard(period) {
      lbOverlay.classList.add('visible');
      const sel = document.querySelector('.lb-tab[data-period="' + (period || 'all') + '"]');
      setActiveTab(sel || document.querySelector('.lb-tab[data-period="all"]'));
    }
    function closeLeaderboard() { lbOverlay.classList.remove('visible'); }
    function setActiveTab(tab) {
      document.querySelectorAll('.lb-tab').forEach(t => t.classList.toggle('active', t === tab));
      loadLeaderboard(tab.dataset.period);
    }
    async function loadLeaderboard(period) {
      const body = document.getElementById('lb-body');
      body.innerHTML = '<div class="lb-loading">Loading…</div>';
      try {
        let url = '/api/leaderboard?period=' + period + '&limit=20';
        if (period === 'challenge' && activeChallenge) url += '&slug=' + encodeURIComponent(activeChallenge.slug);
        const r = await fetch(url);
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
        renderLeaderboard(data.entries || []);
      } catch (err) {
        body.innerHTML = '<div class="lb-empty">Couldn’t load: ' + escapeHtml(err.message) + '</div>';
      }
    }
    function renderLeaderboard(entries) {
      const body = document.getElementById('lb-body');
      if (!entries.length) {
        body.innerHTML = '<div class="lb-empty">No scores yet — be the first.</div>';
        return;
      }
      const me = getClientId();
      const myName = getStoredName();
      const ul = document.createElement('ul');
      ul.className = 'lb-list';
      entries.forEach((e, i) => {
        const rank = e.rank || (i + 1);
        const isMe = (e.client_id === me) ||
                     (myName && (e.name || '').toLowerCase() === myName.toLowerCase());
        const topCls = rank === 1 ? ' top1' : rank === 2 ? ' top2' : rank === 3 ? ' top3' : '';
        const li = document.createElement('li');
        li.className = 'lb-row' + topCls + (isMe ? ' you' : '');
        li.innerHTML =
          '<span class="rank">#' + rank + '</span>' +
          '<span class="name">' + escapeHtml(e.name || '???') + '</span>' +
          '<span class="score">' + (e.score || 0).toLocaleString() + '</span>';
        ul.appendChild(li);
      });
      body.innerHTML = '';
      body.appendChild(ul);
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    document.getElementById('lb-close').addEventListener('click', closeLeaderboard);
    document.querySelectorAll('.lb-tab').forEach(t => {
      t.addEventListener('click', () => setActiveTab(t));
    });
    lbBtn.addEventListener('click', () => openLeaderboard('all'));

    // ---------- Active challenge banner ----------
    async function fetchActiveChallenge() {
      try {
        const r = await fetch('/api/challenges?active=1');
        if (!r.ok) return;
        const list = await r.json();
        const ch = (list || [])[0];
        if (!ch) return;
        activeChallenge = ch;
        const endsAt = new Date(ch.ends_at);
        const days = Math.max(0, Math.ceil((endsAt - Date.now()) / 86400000));
        banner.innerHTML = '<b>' + escapeHtml(ch.title) + '</b> · ends in ' + days + 'd' +
          (ch.prize ? ' · prize: ' + escapeHtml(ch.prize) : '');
        banner.classList.add('visible');
        banner.addEventListener('click', () => openLeaderboard('challenge'));
        document.getElementById('lb-tab-challenge').style.display = '';
      } catch (_) { /* API offline → skip silently */ }
    }

    // ---------- Toast ----------
    let toastTimer = null;
    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 2500);
    }

    // ---------- Desktop niceties ----------
    // Prevent page scroll on arrow keys / space — but ONLY when the user
    // isn't typing in a form field. Otherwise this would swallow spaces
    // in the name input and block arrow-key cursor movement.
    window.addEventListener('keydown', e => {
      const t = e.target;
      const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
      if (typing) return;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) !== -1) {
        e.preventDefault();
      }
    });
    document.addEventListener('gesturestart', e => e.preventDefault());
  </script>
